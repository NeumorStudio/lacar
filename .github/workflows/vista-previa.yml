# Vista previa de la propuesta v2: cada push a la rama propuesta-v2 se sube a Cloudflare Pages
# como despliegue de prueba (propuesta-v2.lacar.pages.dev). No toca la web publicada (main).
name: Vista previa propuesta v2

on:
  push:
    branches: [propuesta-v2]

jobs:
  vista-previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir como vista previa (lacar, rama propuesta-v2)
        run: |
          rm -f wrangler.toml
          npx --yes wrangler@4 pages deploy dist --project-name=lacar --branch=propuesta-v2 --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a67f6a32d28dd65d954584891e5d8b9c
